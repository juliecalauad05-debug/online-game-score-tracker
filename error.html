{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card auth center">
  <h1>{{ code }}</h1>
  <h2>{{ title }}</h2>
  <p class="muted">{{ message }}</p>
  <a class="btn" href="{{ url_for('index') }}">Back to dashboard</a>
</div>
{% endblock %}
